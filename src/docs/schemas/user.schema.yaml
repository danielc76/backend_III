components:
  schemas:
    User:
      type: object
      properties:
        _id:
          type: string
          description: ID único del usuario generado por MongoDB
          example: 6a58f65e8b70e78947f240c8

        firstName:
          type: string
          description: Nombre del usuario
          example: Daniel

        lastName:
          type: string
          description: Apellido del usuario
          example: Cardaci

        email:
          type: string
          format: email
          description: Email del usuario
          example: daniel@test.com

        password:
          type: string
          description: Contraseña del usuario
          example: "123456"

        role:
          type: string
          description: Rol asignado al usuario
          enum:
            - admin
            - customer
            - driver
            - user
            - store
          default: customer
          example: customer

        documents:
          type: array
          description: Documentos asociados al usuario
          items:
            type: object
            properties:
              name:
                type: string
                example: DNI
              reference:
                type: string
                example: documento.pdf

        createdAt:
          type: string
          format: date-time
          description: Fecha de creación del usuario

        updatedAt:
          type: string
          format: date-time
          description: Fecha de última actualización del usuario