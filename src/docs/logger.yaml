paths:

  /api/logger:
    get:
      summary: Probar los niveles del logger
      description: Endpoint interno utilizado únicamente para verificar que los niveles de logging de ShipNow funcionen correctamente. No representa una funcionalidad de negocio.
      tags:
        - Logger

      responses:
        "200":
          description: Logs generados correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                message: Logs generados correctamente

        "500":
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                error: INTERNAL_SERVER_ERROR
                message: Error interno del servidor