paths:

  /api/users:
    get:
      summary: Obtener todos los usuarios
      description: Devuelve una lista limitada de usuarios y permite filtrar por rol.
      tags:
        - Users

      parameters:
        - name: limit
          in: query
          required: false
          description: Cantidad de resultados. El valor por defecto es 20 y el máximo es 100.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20

        - name: role
          in: query
          required: false
          description: Rol utilizado para filtrar usuarios
          schema:
            type: string
            enum:
              - admin
              - customer
              - driver
              - user
              - store

      responses:
        "200":
          description: Lista de usuarios obtenida correctamente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'

        "500":
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                error: INTERNAL_SERVER_ERROR
                message: Error interno del servidor


    post:
      summary: Crear un usuario
      description: Crea un nuevo usuario en ShipNow.
      tags:
        - Users

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object

              required:
                - firstName
                - lastName
                - email
                - password

              properties:
                firstName:
                  type: string
                  example: Juan

                lastName:
                  type: string
                  example: Perez

                email:
                  type: string
                  format: email
                  example: juan@test.com

                password:
                  type: string
                  example: "123456"

                role:
                  type: string
                  enum:
                    - customer
                    - driver
                    - user
                    - store
                  default: customer
                  example: customer

      responses:
        "201":
          description: Usuario creado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

        "400":
          description: Datos obligatorios faltantes, inválidos o usuario existente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                validationError:
                  summary: Faltan datos obligatorios
                  value:
                    status: error
                    error: VALIDATION_ERROR
                    message: Faltan datos obligatorios

                userAlreadyExist:
                  summary: El usuario ya existe
                  value:
                    status: error
                    error: USER_ALREADY_EXIST
                    message: El usuario ya existe

                invalidData:
                  summary: Los datos enviados no son válidos
                  value:
                    status: error
                    error: INVALID_DATA
                    message: Los datos enviados no son válidos

        "403":
          description: No se permite crear un usuario con rol administrador
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                error: FORBIDDEN
                message: Acción no permitida

        "500":
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                error: INTERNAL_SERVER_ERROR
                message: Error interno del servidor


  /api/users/{uid}:
    get:
      summary: Obtener un usuario por ID
      description: Busca un usuario utilizando su identificador único.
      tags:
        - Users

      parameters:
        - name: uid
          in: path
          required: true
          description: ID del usuario
          schema:
            type: string
          example: 6a58f65e8b70e78947f240c8

      responses:
        "200":
          description: Usuario obtenido correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

        "400":
          description: El identificador no tiene un formato válido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                error: INVALID_DATA
                message: Los datos enviados no son válidos

        "404":
          description: Usuario no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                error: USER_NOT_FOUND
                message: Usuario no encontrado

        "500":
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                error: INTERNAL_SERVER_ERROR
                message: Error interno del servidor

    delete:
      summary: Eliminar un usuario
      description: Elimina un usuario utilizando su identificador único.
      tags:
        - Users

      parameters:
        - name: uid
          in: path
          required: true
          description: ID del usuario
          schema:
            type: string
          example: 6a58f65e8b70e78947f240c8

      responses:
        "200":
          description: Usuario eliminado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                message: Usuario eliminado

        "404":
          description: Usuario no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                error: USER_NOT_FOUND
                message: Usuario no encontrado

        "500":
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                error: INTERNAL_SERVER_ERROR
                message: Error interno del servidor


  /api/users/{uid}/documents:
    post:
      summary: Cargar un documento de usuario
      description: Guarda un archivo en el servidor y asocia sus metadatos al usuario.
      tags:
        - Users

      parameters:
        - name: uid
          in: path
          required: true
          description: ID del usuario
          schema:
            type: string

      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - document
                - documentType
              properties:
                document:
                  type: string
                  format: binary
                  description: Archivo PDF, JPG o PNG de hasta 5 MB
                documentType:
                  type: string
                  enum:
                    - user_document
                    - driver_license
                  description: Tipo de documento enviado

      responses:
        "201":
          description: Documento cargado correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  user:
                    $ref: '#/components/schemas/User'

        "400":
          description: Archivo faltante, campo incorrecto, formato o tipo de documento inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        "404":
          description: Usuario no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        "413":
          description: El archivo supera el límite de 5 MB
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        "500":
          description: Error al guardar el archivo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
